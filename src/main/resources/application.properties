# ============================================================
# Sistema RFID de Gestion de Activos
# API REST para gestionar categorias de activos
# ============================================================

# Identificacion de la aplicacion.
spring.application.name=RFIDCategoriaActivoSpring

# ============================================================
# Conexion con MySQL
# ============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/rfid_gestion_activos?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=${RFID_DB_USER}
spring.datasource.password=${RFID_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA e Hibernate
# ============================================================

# La estructura de la base se administra mediante el script SQL.
# Hibernate no debe crear, modificar ni eliminar tablas.
spring.jpa.hibernate.ddl-auto=none

# Evita mantener abierta la sesion de persistencia
# durante la generacion de la respuesta HTTP.
spring.jpa.open-in-view=false

# Evita mostrar todas las consultas SQL en la consola final.
spring.jpa.show-sql=false

# ============================================================
# Servidor web integrado
# ============================================================

# Puerto independiente del proyecto web anterior.
server.port=8081

# Evita exponer trazas internas en respuestas de error.
server.error.include-stacktrace=never
server.error.include-exception=false